<!-- Анкета Digital Nomad Residency.
     Вставить в блок T123 (Библиотека блоков -> Другое -> T123 -> «Контент блока»).
     ?light — принудительно светлая тема, чтобы совпадала с сайтом.
     Уберите ?light, если хотите, чтобы тема подстраивалась под систему посетителя. -->

<div style="max-width:1120px;margin:0 auto;">
  <iframe id="dnrFrame"
          src="https://arturayupov.github.io/dnr-anketa/?light"
          style="width:100%;border:0;display:block;min-height:1200px;"
          loading="lazy"
          title="Анкета Digital Nomad Residency"></iframe>
</div>

<script>
window.addEventListener("message", function (e) {
  if (e.origin !== "https://arturayupov.github.io") return;
  var h = e.data && e.data.dnrHeight;
  if (h) document.getElementById("dnrFrame").style.height = (h + 24) + "px";
});
</script>
